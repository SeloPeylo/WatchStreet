<details class="card panel" id="chart-panel" {{ 'open' if is_open }}>
  <summary><h2>Kursverlauf (Kerzen)</h2></summary>
  <div class="chart-head">
    <span class="muted small">Intervall</span>
    <div class="seg" id="intervals">
      {% for i in intervals %}<button type="button" data-interval="{{ i }}" class="{{ 'active' if i == default_interval else '' }}">{{ {'1h':'Stunde','1d':'Tag','1wk':'Woche'}[i] }}</button>{% endfor %}
    </div>
  </div>
  <div id="chart" data-url="/api/stocks/{{ stock.id }}/candles" data-interval="{{ default_interval }}"></div>
</details>
