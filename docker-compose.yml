# Run the app:      docker compose up --build        -> http://localhost:8000
# Run quality gate: docker compose --profile quality up -d sonarqube
#                   docker compose --profile quality run --rm checks
#                   docker compose --profile quality run --rm sonar-scanner

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    WATCHSTREET_DATABASE_URL: sqlite:////data/watchstreet.db
  volumes:
    - watchstreet-data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach Ollama / local agents on the host
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "watchstreet.worker"]
    healthcheck:
      disable: true
    depends_on:
      - web

  # ---------------------------------------------------------------- quality gate
  checks:
    profiles: [quality]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["make", "check"]

  sonarqube:
    profiles: [quality]
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions

  sonar-scanner:
    profiles: [quality]
    image: sonarsource/sonar-scanner-cli:latest
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src

volumes:
  watchstreet-data:
  sonarqube-data:
  sonarqube-extensions:
