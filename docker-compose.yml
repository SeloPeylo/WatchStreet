# Everything runs from this folder; nothing machine-specific is required.
#
#   docker compose up --build                       app + Postgres      -> http://localhost:8000
#   docker compose --profile llm-gpu up --build     + llama.cpp on the host GPU (NVIDIA)
#   docker compose --profile llm-cpu up --build     + llama.cpp on CPU
#   (set WATCHSTREET_AGENT_RUNNER=llama in .env to let the harness use it)
#
# Data lives in ./data/postgres, models in ./models (both inside the project folder).
# Quality gate: docker compose --profile quality run --rm checks   (see docs/engineering-rules.md)

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    WATCHSTREET_DATABASE_URL: postgresql+psycopg://watchstreet:${POSTGRES_PASSWORD:-watchstreet}@db:5432/watchstreet
    WATCHSTREET_LLAMA_BASE_URL: http://llama:8080/v1
    WATCHSTREET_AGENT_TIMEOUT_S: ${WATCHSTREET_AGENT_TIMEOUT_S:-600}
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach Ollama / other agents on the host
  restart: unless-stopped

x-llama: &llama
  # server image bundles llama-server; --jinja enables the chat template required for tool calls
  restart: unless-stopped
  volumes:
    - ${MODELS_DIR:-./models}:/models:ro
  ports:
    - "${LLAMA_PORT:-8080}:8080"
  mem_limit: ${LLAMA_MEM_LIMIT:-0}          # e.g. 24g; 0 = unlimited
  command: >
    -m /models/${LLAMA_MODEL:-model.gguf}
    --host 0.0.0.0 --port 8080 --jinja
    -c ${LLAMA_CTX:-8192}
    -ngl ${LLAMA_N_GPU_LAYERS:-99}
    -t ${LLAMA_THREADS:-8}
    -np ${LLAMA_PARALLEL:-1}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchstreet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchstreet}
      POSTGRES_DB: watchstreet
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchstreet -d watchstreet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"   # no login yet: reachable from this machine only
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "watchstreet.worker"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy   # web creates the schema first

  # ---------------------------------------------------------------- local LLM
  llama-cpu:
    <<: *llama
    profiles: [llm-cpu]
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      default:
        aliases: [llama]
    command: >
      -m /models/${LLAMA_MODEL:-model.gguf}
      --host 0.0.0.0 --port 8080 --jinja
      -c ${LLAMA_CTX:-8192} -ngl 0
      -t ${LLAMA_THREADS:-8} -np ${LLAMA_PARALLEL:-1}

  llama-gpu:
    <<: *llama
    profiles: [llm-gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    networks:
      default:
        aliases: [llama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${LLAMA_GPU_COUNT:-all}   # e.g. 1 to limit the GPUs used
              capabilities: [gpu]

  # ---------------------------------------------------------------- quality gate
  checks:
    profiles: [quality]
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["make", "check"]

  sonarqube:
    profiles: [quality]
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions

  sonar-scanner:
    profiles: [quality]
    image: sonarsource/sonar-scanner-cli:latest
    depends_on:
      - sonarqube
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src

volumes:
  sonarqube-data:
  sonarqube-extensions:
