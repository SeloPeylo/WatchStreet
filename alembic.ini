# Developer entry point for the alembic CLI, e.g.
#   alembic -c alembic.ini revision --autogenerate -m "add column"
#   alembic -c alembic.ini upgrade head
# The application itself migrates on start (watchstreet.migrate.upgrade_to_head) and does not
# read this file. The database comes from WATCHSTREET_DATABASE_URL.
[alembic]
script_location = src/watchstreet/migrations
file_template = %%(rev)s_%%(slug)s
