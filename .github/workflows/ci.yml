name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ws, POSTGRES_PASSWORD: ws, POSTGRES_DB: ws}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ws" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest --no-cov
        env:
          WATCHSTREET_TEST_DATABASE_URL: postgresql+psycopg://ws:ws@localhost:5432/ws
  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t watchstreet .
